<!doctype html>
<html lang="en">
   <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Omega Toolkit</title>
    <meta
      name="description"
      content="A free, open-source collection of everyday utilities — JSON/CSV converters, image tools, JWT decoder, hash generator, and more. No sign-up, nothing uploaded to a server."
    />

    <!-- Open Graph (Facebook, LinkedIn, Discord, Slack, WhatsApp...) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="Omega Toolkit — Free Browser Tools for Dev, Files & Images" />
    <meta
      property="og:description"
      content="A free, open-source collection of everyday utilities — JSON/CSV converters, image tools, JWT decoder, hash generator, and more. No sign-up, nothing uploaded to a server."
    />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Omega Toolkit" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omega Toolkit — Free Browser Tools for Dev, Files & Images" />
    <meta
      name="twitter:description"
      content="A free, open-source collection of everyday utilities — JSON/CSV converters, image tools, JWT decoder, hash generator, and more."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <meta name="theme-color" content="#131720" />
  </head>

    <div id="root"></div>
